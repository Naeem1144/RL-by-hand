[project]
name = "rl-by-hand"
version = "0.1.0"
description = "Reinforcement learning algorithms implemented from scratch with NumPy and Matplotlib."
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
