[project]
name = "rl-by-hand"
version = "0.1.0"
description = "Interchangeable multi-armed bandit algorithms implemented from scratch."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project.scripts]
rl-study = "study.compare:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["algorithms*", "evaluation*", "problems*", "study*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
